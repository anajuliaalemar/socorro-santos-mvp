name: Continuous Integration - MVP Socorro Santos

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-sqlalchemy pytest pytest-cov

    - name: Executar Testes Automatizados e Gerar Cobertura
      run: |
        python -m pytest --cov=app test_app.py --cov-report=term-missing